name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bira Flow version
      placeholder: "Settings → About, or the installer file name"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Transcription engine
      options:
        - Local model (whisper.cpp)
        - Groq
        - OpenAI
        - Vercel AI Gateway
        - I do not know
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The content of %APPDATA%\BiraFlow\biraflow.log (it never contains your dictated text)
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed the API keys from the log (they are never written there, but just in case)
          required: false
